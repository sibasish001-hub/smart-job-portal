spring:
  application:
    name: smart-job-portal-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobportal}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Database schema managed by Flyway
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025} # MailHog port
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Application specific properties
app:
  jwt:
    # 256-bit secret key in base64. Ensure this is overridden in production!
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1hbmQtc3Ryb25nLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLXNtYXJ0LWpvYi1wb3J0YWw=}
    accessTokenExpirationMs: ${JWT_ACCESS_EXPIRATION:3600000} # 1 hour
    refreshTokenExpirationMs: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
  
  upload:
    dir: ${UPLOAD_DIR:C:/Users/Hello/.gemini/antigravity/scratch/smart-job-portal/uploads}

  ai:
    # Support 'gemini', 'openai', or 'ollama'
    provider: ${AI_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
    openai:
      api-key: ${OPENAI_API_KEY:}
      url: https://api.openai.com/v1/chat/completions
      model: gpt-4o-mini
    ollama:
      url: http://localhost:11434/api/generate
      model: llama3

server:
  port: ${PORT:8080}
  error:
    include-message: always

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.jobportal: DEBUG
